<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Jost,system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{min-height:900px;background:#111110;color:#ece8df;font-size:14px;padding:0 64px 56px;box-sizing:border-box}
.bar{display:flex;justify-content:space-between;align-items:center;padding:30px 0;border-bottom:1px solid #2a2926}
.logo{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:500;letter-spacing:.04em}
.nav{display:flex;gap:40px}
.nv{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#9b968c;padding:6px 0;border-bottom:1px solid transparent}
.nv.on{color:#ece8df;border-bottom-color:#c8b07a}
.serif{font-family:'Cormorant Garamond',serif}
h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:68px;line-height:1;margin:48px 0 10px;letter-spacing:-.01em}
.eye{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#c8b07a}
.m{color:#9b968c}
.hr{border-top:1px solid #2a2926}
.btn{font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:14px 28px;border:1px solid #4a4740}
.pri{background:#c8b07a;color:#111110;border-color:#c8b07a}
.chip{font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:7px 14px;border:1px solid #2a2926;color:#9b968c}
.chip.on{color:#ece8df;border-color:#c8b07a}
.fld{background:none;border:0;border-bottom:1px solid #4a4740;color:#ece8df;font:inherit;padding:8px 2px}
.t{position:relative;aspect-ratio:3/4}
.t i{position:absolute;left:8px;bottom:8px;font-style:normal;font-size:10px;letter-spacing:.16em;padding:3px 7px;background:#111110cc}
.t b{position:absolute;right:8px;top:8px;font-size:10px;letter-spacing:.16em;padding:3px 7px;background:#111110;color:#c8b07a}
.q1{background:linear-gradient(160deg,#2c3540,#4a5766)}
.q2{background:linear-gradient(160deg,#3a3028,#6b5844)}
.q3{background:linear-gradient(160deg,#26352f,#47634f)}
.q4{background:linear-gradient(160deg,#322b3a,#58496b)}
.q5{background:linear-gradient(160deg,#3b2b2b,#6b4a4a)}
.q6{background:linear-gradient(160deg,#2d3330,#55605a)}
input[type=checkbox]{accent-color:#c8b07a}
.app{position:relative;overflow:hidden}
.app::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.app::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,#0009 100%)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes sway{0%,100%{transform:scale(1.04) translateX(0)}50%{transform:scale(1.1) translateX(-2%)}}
@keyframes drift{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
@keyframes glow{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shim{from{background-position:0 0}to{background-position:200% 0}}
@keyframes grow{from{width:0}to{width:80%}}
@keyframes bird{from{transform:translate(-40px,24px)}to{transform:translate(560px,-34px)}}
.app>*{animation:up 1s cubic-bezier(.2,.7,.2,1) both}
.app>:nth-child(3){animation-delay:.1s}.app>:nth-child(4){animation-delay:.2s}.app>:nth-child(5){animation-delay:.3s}.app>:nth-child(6){animation-delay:.4s}.app>:nth-child(7){animation-delay:.5s}.app>:nth-child(8){animation-delay:.6s}
.t{overflow:hidden;transition:transform .7s cubic-bezier(.2,.7,.2,1),box-shadow .7s}
.t .s{transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.t:hover{transform:translateY(-6px);box-shadow:0 22px 44px #000b}
.t:hover .s{transform:scale(1.14)}
.t::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,#ffffff2e 50%,transparent 60%);transform:translateX(-110%);transition:transform 1.1s}
.t:hover::after{transform:translateX(110%)}
.nv{position:relative;transition:color .4s}
.nv:hover{color:#ece8df}
.nv::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:#c8b07a;transform:scaleX(0);transition:transform .5s}
.nv:hover::after,.nv.on::after{transform:scaleX(1)}
.btn,.chip{transition:all .5s cubic-bezier(.2,.7,.2,1)}
.btn:hover{background:#c8b07a;color:#111110;border-color:#c8b07a;letter-spacing:.24em}
.pri:hover{background:transparent;color:#c8b07a}
.chip:hover{color:#ece8df;border-color:#c8b07a}
tr.hr:hover{background:#ffffff0a}
.fill{height:3px;width:80%;background:linear-gradient(90deg,#c8b07a,#f3e4cf,#c8b07a);background-size:200% 100%;animation:grow 2.6s ease-out both,shim 3s linear infinite}
.rule{height:1px;width:140px;background:#c8b07a;margin:0 0 22px;transform-origin:left;animation:draw 1.6s .7s cubic-bezier(.2,.7,.2,1) both}
.pan{animation:sway 22s ease-in-out infinite}
.sun{position:absolute;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#fff3dcb0,transparent 70%);animation:glow 6s ease-in-out infinite}
.mist{position:absolute;left:-20%;right:-20%;bottom:18%;height:38%;background:linear-gradient(90deg,transparent,#ffffff44,transparent);filter:blur(16px);animation:drift 15s ease-in-out infinite alternate}
.bird{position:absolute;left:0;opacity:.85;animation:bird 17s linear infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.s{position:absolute;inset:0;width:100%;height:100%}
</style>

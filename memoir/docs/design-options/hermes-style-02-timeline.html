<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timeline, Hermes style</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{min-height:900px;background-color:#0000f2;background-image:linear-gradient(#ffffff14 1px,transparent 1px),linear-gradient(90deg,#ffffff14 1px,transparent 1px);background-size:48px 48px;color:#fff;font-size:15px;padding:0 48px 48px;box-sizing:border-box;position:relative;overflow:hidden}
.mono{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.m{color:#ffffffc4}
.bar{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid #ffffff59}
.logo{font-weight:800;font-size:24px;letter-spacing:-.02em}
.nav{display:flex;gap:6px}
.nv{padding:10px 14px;border:1px solid transparent;transition:.3s}
.nv:hover{border-color:#ffffff99}
.nv.on{background:#fff;color:#0000f2}
.btn{padding:14px 22px;border:1px solid #fff;transition:.3s}
.btn:hover{background:#fff;color:#0000f2}
.pri{background:#f4efe2;color:#0000f2;border-color:#f4efe2}
.pri:hover{background:transparent;color:#f4efe2}
h1{font-weight:800;font-size:96px;line-height:.92;letter-spacing:-.04em;margin:0}
.card{border:1px solid #ffffff73;background:#00009acc}
.chip{padding:7px 12px;border:1px solid #ffffff73;transition:.3s}
.chip:hover,.chip.on{background:#fff;color:#0000f2;border-color:#fff}
.fld{background:transparent;border:1px solid #ffffff73;color:#fff;padding:10px 14px;font:inherit}
.fld::placeholder{color:#ffffffb8}
input[type=checkbox]{accent-color:#f4efe2}
.t{aspect-ratio:1;position:relative;border:1px solid #ffffff59;overflow:hidden;transition:.4s}
.t:hover{border-color:#fff;transform:translateY(-4px)}
.t i{position:absolute;left:6px;bottom:6px;font-style:normal;padding:3px 7px;background:#0000f2;color:#fff;font-size:10px}
.t b{position:absolute;right:6px;top:6px;padding:3px 7px;background:#ffb199;color:#0000f2;font-size:10px}
.d1{background:linear-gradient(135deg,#0000b8,#8c8cff)}
.d2{background:linear-gradient(135deg,#f4efe2,#ffb199)}
.d3{background:linear-gradient(135deg,#5a5aff,#f4efe2)}
.d4{background:linear-gradient(135deg,#00007a,#5a5aff)}
.d5{background:linear-gradient(135deg,#ffb199,#8c8cff)}
.d6{background:linear-gradient(135deg,#b9b9ff,#00009a)}
.row{display:flex;gap:12px;padding:14px 4px;border-top:1px solid #ffffff40}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.3}}
.app>*{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.app>:nth-child(2){animation-delay:.08s}.app>:nth-child(3){animation-delay:.16s}.app>:nth-child(4){animation-delay:.24s}.app>:nth-child(5){animation-delay:.32s}.app>:nth-child(6){animation-delay:.4s}
.cur{display:inline-block;width:9px;height:18px;background:#f4efe2;margin-left:4px;vertical-align:-3px;animation:blink 1s steps(1) infinite}
.spin{animation:spin 60s linear infinite;transform-box:fill-box;transform-origin:center}
.spin2{animation:spin 90s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.sg{flex:1;height:22px;border:1px solid #fff}
.ok{background:#f4efe2}.go{background:#fff;animation:pulse 1.2s infinite}.miss{background:repeating-linear-gradient(45deg,#ffb199 0 4px,transparent 4px 8px);border-color:#ffb199}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="app">
<header class="bar"><div class="logo">◐ Memoir</div><nav class="nav"><button type="button" class="nv mono">Upload</button><button type="button" class="nv mono on">Timeline</button><button type="button" class="nv mono">Review 73</button><button type="button" class="nv mono">Duplicates 184</button></nav><button type="button" class="btn pri mono">Export</button></header>
<section style="padding:44px 0 26px"><div class="mono m">// 02 Chronology</div><h1 style="font-size:88px;margin-top:14px">Timeline</h1></section>
<div class="mono" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;align-items:center"><input class="fld" aria-label="Search files" placeholder="Search files" style="width:240px"><span class="chip">Type</span><span class="chip">Format</span><span class="chip">Source</span><span class="chip on">All items</span></div>
<div style="display:grid;grid-template-columns:1fr 64px;gap:22px">
<div class="card" style="padding:26px"><div class="mono" style="margin-bottom:14px">14.03.2024 <span class="m">// 6 items</span></div><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:34px"><div class="t d1"><i class="mono">JPG</i></div><div class="t d2"><i class="mono">HEIC</i></div><div class="t d3"><i class="mono">MP4</i></div><div class="t d4"><i class="mono">DNG</i></div><div class="t d5"><i class="mono">LIVE</i></div><div class="t d6"><i class="mono">MKV</i><b class="mono">Review</b></div></div><div class="mono" style="margin-bottom:14px">13.03.2024 <span class="m">// 6 items</span></div><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px"><div class="t d2"><i class="mono">HEIC</i></div><div class="t d1"><i class="mono">JPG</i></div><div class="t d5"><i class="mono">MOV</i></div><div class="t d4"><i class="mono">CR3</i></div><div class="t d3"><i class="mono">PNG</i></div><div class="t d6"><i class="mono">WEBP</i><b class="mono">Review</b></div></div></div>
<aside class="mono" style="display:flex;flex-direction:column;gap:16px;text-align:right;font-size:13px"><span style="color:#f4efe2">2024</span><span class="m">2023</span><span class="m">2022</span><span class="m">2021</span></aside></div>
</div>

</body>
</html>

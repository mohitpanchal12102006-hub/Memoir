[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memoir-engine"
version = "1.0.0"
description = "Memoir: lossless chronology and Google Takeout organizer"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "pillow>=10.0", "pillow-heif>=0.16", "psutil>=5.9"]

[project.scripts]
memoir = "memoir_engine.__main__:main"

[tool.setuptools]
packages = ["memoir_engine"]

[tool.setuptools.package-data]
memoir_engine = ["static/*", "static/**/*"]
